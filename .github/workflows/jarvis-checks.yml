name: JARVIS CORE checks

on:
  push:
    branches:
      - upgrade/command-center-v3
  pull_request:
    branches:
      - feature/ai-task-video-studio

jobs:
  diagnostics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install fastapi pytest
      - name: Run diagnostics tests
        run: python -m pytest -q
